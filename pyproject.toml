[project]
name = "control-system-backend"
version = "1.0.0"
description = ""
authors = [
    {name = "Vladyslav Tsurkan",email = "vtsurkan2002@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[all] (>=0.135.0,<0.136.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic[email] (>=2.11.1,<3.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "pydantic-extra-types (>=2.10.3,<3.0.0)",
    "sqlalchemy-timescaledb (>=0.4.1,<0.5.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "aiohttp (>=3.12.13,<4.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "orjson (>=3.11.7,<4.0.0)",
    "cryptography (>=46.0.5,<47.0.0)",
    "faststream[rabbit] (>=0.5.0,<1.0.0)",
    "celery (>=5.4.0,<6.0.0)",
    "aio-pika (>=9.4.0,<10.0.0)",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.14
target-version = "py314"

# Allow fix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
